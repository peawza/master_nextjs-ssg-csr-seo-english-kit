# DEPLOY-001: static hosting for the Next.js export (next.config.ts: output 'export', trailingSlash true).
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Relative Location headers so redirects stay correct behind port mapping / reverse proxies.
    absolute_redirect off;

    charset utf-8;
    charset_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    # Custom 404 generated by src/app/not-found.tsx; served with HTTP 404.
    error_page 404 /404.html;

    # Container healthcheck (no logging noise).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Content-hashed build assets: safe to cache forever.
    location /_next/static/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /404.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        internal;
    }

    # HTML and other files: revalidate so new deployments are picked up immediately.
    # "$uri/" makes nginx 301 /services -> /services/ to match trailingSlash: true.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
