      - heading [level=2] [ref=e142]:
        - text: Passalacqua is unique. Back in the 18
        - superscript [ref=e143]: th
        - text: century, it was created as a place of the heart on Lake Como for friends, for love and leisure, for the pleasures of the table and the Italian art of dolce far niente. It is that same place of the heart today. Welcome to Passalacqua.
      - generic [ref=e146]:
        - img "Moltrasio And Passalacqua By Night" [ref=e150]
        - generic [ref=e152]:
          - heading "The best season to visit Lake Como? Every season." [level=3] [ref=e153]
          - paragraph [ref=e154]: Spring, when blossom scents the air and daubs white brushstrokes on green hillsides above cobalt blue water. Summer, when long lazy days merge into magical nights alive with promise. Fall, when the woods are tinged with russet and copper, when fragrant truffles and green-gold olive oil enrich the table. Winter, when the lake rests beneath soft winter light, the mountains wear their snowy crowns and the timeless beauty of Lake Como reveals its most intimate and enchanting side. A 5 star hotel on Lake Como with warm, personalised service, Passalacqua is your gateway to a region for all seasons.
