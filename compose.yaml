# DEPLOY-001: local / single-host Docker deployment of the static export.
# Usage: docker compose up -d --build   ->   http://localhost:8080/
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: seo-first-nextjs-static:latest
    container_name: seo-first-nextjs-web
    ports:
      - "${WEB_PORT:-8080}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
